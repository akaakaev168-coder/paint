<style>
:root{--bg:#04060c;--ink:#e6edf7;--mu:#7f8aa6;--a:#4de1ff;--v:#8b7bff;--ln:rgba(140,190,255,.18);--gl:rgba(12,18,34,.72);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:14.5px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;min-height:100vh;background:radial-gradient(1000px 600px at 20% -10%,#0f2144,transparent 60%),radial-gradient(800px 500px at 100% 100%,#1a1040,transparent 55%),var(--bg);background-attachment:fixed}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 28px;border-bottom:1px solid var(--ln)}
.brand b{font-size:17px;letter-spacing:.34em;font-weight:300}.brand small{display:block;font-size:12px;color:var(--mu);letter-spacing:.02em}
.hd{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mu)}
select,button,input,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:10px;padding:8px 13px}
select option{background:#0b1222}
button{cursor:pointer;transition:border-color .15s,background .15s,transform .08s}
button:hover:not(:disabled){border-color:var(--a);background:rgba(77,225,255,.09)}button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.38;cursor:not-allowed}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(300px,1.05fr) minmax(320px,1fr);gap:24px;padding:26px 28px;max-width:1160px;margin:auto;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr;padding:16px}}
.stage{position:relative;overflow:hidden;border:1px solid var(--ln);border-radius:26px;padding:16px 16px 18px;text-align:center;background:radial-gradient(circle at 50% 46%,#10294d 0,#08101f 52%,#05080f 100%)}
.stage::before{content:"";position:absolute;left:50%;top:50%;width:84%;aspect-ratio:1;transform:translate(-50%,-44%);border-radius:50%;border:1px solid rgba(77,225,255,.22);box-shadow:0 0 70px rgba(77,225,255,.12),inset 0 0 60px rgba(139,123,255,.1)}
.stage::after{content:"";position:absolute;left:12%;right:12%;bottom:42px;height:46px;background:radial-gradient(ellipse at center,rgba(77,225,255,.28),transparent 70%)}
.stage>*{position:relative;z-index:1}
.lv{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu)}.lv .bar{flex:1}
#bubble{min-height:48px;margin:12px auto 0;max-width:340px;padding:9px 16px;background:rgba(8,14,28,.78);backdrop-filter:blur(8px);border:1px solid rgba(77,225,255,.35);border-radius:14px;font-size:14px;text-align:left}
#bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:#0a1224;border-right:1px solid rgba(77,225,255,.35);border-bottom:1px solid rgba(77,225,255,.35);transform:translateX(-50%) rotate(45deg)}
svg#bot{width:100%;max-width:340px;height:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;display:block;margin:18px auto 0}
#status{display:inline-block;margin-top:2px;padding:3px 16px;border:1px solid var(--a);border-radius:99px;color:var(--a);font-size:13px;letter-spacing:.04em}
#toast{min-height:20px;margin-top:8px;font-size:13px;color:var(--mu)}
.fx{position:absolute;pointer-events:none;font-size:20px;font-weight:600;z-index:3;color:var(--a);animation:rise 1.4s ease-out forwards}
@keyframes rise{to{transform:translate(var(--dx),-130px);opacity:0}}
.panel{background:var(--gl);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:26px;padding:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 22px;margin-bottom:18px}
.st label{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:4px}.st b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--a));border-radius:4px;transition:width .4s}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--ln)}
nav button{border-color:transparent;color:var(--mu)}nav button[aria-selected=true]{color:var(--a);border-color:var(--a);background:rgba(77,225,255,.1)}
h3{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--mu);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.card{text-align:left}.opt{display:block;width:100%;margin:8px 0;text-align:left}.ltx{background:rgba(255,255,255,.04);padding:12px 14px;border-radius:12px;border:1px solid var(--ln)}
#log{height:240px;overflow:auto;border:1px solid var(--ln);border-radius:12px;padding:8px;margin-bottom:8px}
.m{margin:6px 0;padding:7px 12px;border-radius:12px;max-width:90%}.m.u{background:rgba(77,225,255,.14);margin-left:auto}.m.b{background:rgba(255,255,255,.06)}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0}
canvas{width:100%;max-width:320px;background:#070b16;border:1px solid var(--ln);border-radius:14px;touch-action:none;display:block;margin:8px auto}
.empty{color:var(--mu);text-align:center;padding:12px;font-size:13px}
textarea{width:100%;height:140px;font-size:12px}
#code{width:100%;height:170px;font:13px/1.4 Consolas,monospace;tab-size:2;white-space:pre;margin:8px 0}
.hint{border-left:2px solid var(--v);padding:4px 12px;margin:6px 0;font-size:13px;background:rgba(139,123,255,.07)}.hint.ok{border-color:var(--a);background:rgba(77,225,255,.07)}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
#eyes{transition:transform .12s;filter:drop-shadow(0 0 7px var(--a))}
.rb{transform-box:fill-box;transform-origin:50% 70%}
#bot .head{animation:float 3.6s ease-in-out infinite}
#bot .wave,#bot .gear,#bot .zz,#bot .warn,#bot .plate{opacity:0}
@keyframes float{50%{transform:translateY(-4px)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(360deg)}}
@keyframes talk{50%{transform:scaleY(2)}}@keyframes hop{50%{transform:translateY(-30px)}}
@keyframes walk{0%,100%{transform:translateX(-34px)}50%{transform:translateX(34px)}}
@keyframes eat{to{transform:scale(0)}}@keyframes chew{50%{transform:scaleY(.4)}}
@keyframes dance{25%{transform:rotate(-9deg) translateY(-8px)}75%{transform:rotate(9deg) translateY(-8px)}}
@keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-115deg)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}@keyframes nod{50%{transform:translateY(7px)}}@keyframes wob{25%{transform:scale(1.04,.96)}75%{transform:scale(.96,1.04)}}
[data-s=listening] .wave{opacity:1}[data-s=listening] .wave rect{animation:talk .5s infinite;transform-box:fill-box;transform-origin:center}
[data-s=thinking] .gear,[data-s=coding] .gear,[data-s=debugging] .gear,[data-s=working] .gear{opacity:1;animation:spin 2s linear infinite;transform-box:fill-box;transform-origin:center}
[data-s=thinking] .eye{animation:pulse .8s infinite}
[data-s=working] .rb,[data-s=coding] .rb,[data-s=debugging] .rb{animation:walk 3.2s ease-in-out infinite}
[data-s=happy] .rb{animation:hop .6s 2}[data-s=celebrating] .rb{animation:hop .5s infinite}
[data-s=happy] #eyes,[data-s=celebrating] #eyes{filter:drop-shadow(0 0 14px #fff)}
[data-s=curious] .head{transform:rotate(-7deg);transform-origin:180px 205px;animation:none}
[data-s=coding] .eye{fill:var(--v)}[data-s=debugging] .eye{fill:#ffb84d}
[data-s=tired] .eye{transform:scaleY(.45);animation:none}[data-s=tired] .head{animation-duration:8s}
[data-s=sleeping] .eye{transform:scaleY(.1);animation:none}[data-s=sleeping] .zz{opacity:1;animation:pulse 2s infinite}
[data-s=error] .eye{fill:#ff5d73}[data-s=error] .warn{opacity:1;animation:pulse .6s infinite}
[data-s=dizzy] .eye{animation:spinr .5s linear infinite}[data-s=dizzy] .head{animation:wob .4s infinite}
[data-s=eating] .plate{opacity:1}[data-s=eating] .food{transform-box:fill-box;transform-origin:center bottom;animation:eat 2.4s ease-in forwards}
[data-s=eating] #mouth{animation:chew .35s infinite;transform-box:fill-box;transform-origin:center}
[data-s=eating] .head{transform:rotate(5deg) translateY(8px);transform-origin:180px 205px;animation:none}
[data-t=spin] .rb{transform-origin:50% 50%}[data-t=hop] .rb{animation:hop .5s 4}[data-t=spin] .rb{animation:spinr .8s linear 3}[data-t=dance] .rb{animation:dance .5s ease-in-out infinite}
[data-t=stroll] .rb{animation:walk 3.4s ease-in-out}[data-t=rainbow] .rb{animation:hue 1.2s linear infinite}
[data-t=wave] .armR{animation:wave .4s infinite;transform-origin:252px 232px}
[data-t=binary] #chest{animation:pulse .2s infinite}[data-t=binary] .eye{animation:pulse .25s infinite}
#bot.talk #mouth{animation:chew .22s infinite;transform-box:fill-box;transform-origin:center}#bot.nod .head{animation:nod .3s}.growl .rb{animation:wob .25s 4}

function lint(src,lg){const H=[],L=src.split("\n");
 if(lg==="js"){try{new Function(src)}catch(e){if(e instanceof SyntaxError)H.push({k:"syntaxerr",m:e.message})}
  L.forEach((s,i)=>{const n=i+1,c=s.replace(/(["'`]).*?\1/g,"");
   if(/^\s*var\s/.test(s))H.push({k:"h_var",l:n});if(/[^=!<>]==[^=]/.test(c))H.push({k:"h_eq",l:n});
   if(/console\.log/.test(s))H.push({k:"h_log",l:n});if(s.length>100)H.push({k:"h_long",l:n});
   if(/catch\s*(\([^)]*\))?\s*\{\s*\}/.test(s))H.push({k:"h_empty",l:n})});
  const seen=new Set();for(const m of src.matchAll(/\b(?:let|const|var)\s+([A-Za-z_$][\w$]*)/g)){const v=m[1];if(seen.has(v))continue;seen.add(v);
   if((src.match(new RegExp("(?<![\\w$])"+v.replace(/\$/g,"\\$")+"(?![\\w$])","g"))||[]).length<2)H.push({k:"h_unused",m:v})}
 }else{
  L.forEach((s,i)=>{const n=i+1,c=s.replace(/#.*$/,"").trimEnd();
   if(/^\s*(if|elif|else|for|while|def|class|try|except|finally|with)\b/.test(c)&&!c.endsWith(":"))H.push({k:"h_colon",l:n});
   if(/==\s*None/.test(s))H.push({k:"h_none",l:n});if(/^\s*print\s+[^(\s=]/.test(s))H.push({k:"h_print",l:n});if(s.length>100)H.push({k:"h_long",l:n})});
  if(/^\t/m.test(src)&&/^ +\S/m.test(src))H.push({k:"h_tab"})}
 if(L.length>5&&!/(\/\/|\/\*|#)/.test(src))H.push({k:"h_nocom"});return H}

 x.fillStyle="#8b9bd0";x.fillRect(G.x-32,392,64,10)}
document.addEventListener("keydown",e=>{if(tab!=="game")return;if(e.key==="ArrowLeft")G.keys.l=1;if(e.key==="ArrowRight")G.keys.r=1});
document.addEventListener("keyup",e=>{if(e.key==="ArrowLeft")G.keys.l=0;if(e.key==="ArrowRight")G.keys.r=0});
/* shop */
const SHOP=[{id:"cell",n:"cell",p:10,k:"inv"},{id:"coffee",n:"coffee",p:5,k:"inv"},{id:"food",n:"food",p:8,k:"inv"},{id:"violet",n:"theme",p:30,k:"theme"},{id:"acc",n:"acc",p:25,k:"acc"}];
function shopUI(v){v.innerHTML=`<p><b>${t("coins")}: ${S.coins}</b></p><div class="grid">`+SHOP.map(i=>{
 const own=i.k==="theme"?S.themes.includes("violet"):i.k==="acc"?S.acc:false;
 return `<div><div>${t(i.n)}${i.k==="inv"?" ("+S.inv[i.id]+")":""}</div><button data-b="${i.id}" ${own?"disabled":""}>${own?t("owned"):t("buy")+" · "+i.p}</button>${own&&i.k==="theme"?`<button data-u="${S.theme==="violet"?"cyan":"violet"}">${t("use")}</button>`:""}</div>`}).join("")+"</div>";
 v.onclick=e=>{const b=e.target.closest("[data-b]"),u=e.target.closest("[data-u]");
  if(u){S.theme=u.dataset.u;save();return render()}
  if(!b)return;const i=SHOP.find(x=>x.id===b.dataset.b);if(S.coins<i.p)return err(t("low"));
  S.coins-=i.p;if(i.k==="inv")S.inv[i.id]++;else if(i.k==="theme"){S.themes.push("violet");S.theme="violet"}else S.acc=true;
  save();toast(t("bought"));react("buy","happy",1500);fx("◆",3);render()}}
/* data */
function dataUI(v){v.onclick=null;v.innerHTML=`<p class="empty">${t("dnote")}</p><div class="row"><button id="ex">${t("export")}</button><button id="cr">${t("clear")}</button></div><textarea id="tx" readonly hidden></textarea>`;
 $("ex").onclick=()=>{const x=$("tx");x.hidden=false;x.value=JSON.stringify(S,null,2);x.select()};
 $("cr").onclick=()=>{if(confirm(t("confirm"))){const l=S.lang;try{localStorage.removeItem(KEY)}catch(e){}S={...D,inv:{...D.inv},themes:["cyan"],chat:[],ok:[],learned:[],lang:l};toast(t("cleared"));render()}}}
/* life loop: exactly one timer */
function life(){if(tick)clearInterval(tick);tick=setInterval(()=>{
 idle++;
 if(++n5>=5){n5=0;
  if(S.sleeping){S.energy=cl(S.energy+CFG.sleepGain);if(S.energy>=100){S.sleeping=false;react("wake","happy",2000)}}
  else{S.energy=cl(S.energy-CFG.drain);S.battery=cl(S.battery-CFG.bat);S.focus=cl(S.focus-.2);S.full=cl(S.full-.35);if(S.energy<20||S.full<15)S.mood=cl(S.mood-.5)}
  if(S.battery<=0&&!S.sleeping){S.sleeping=true;setState("sleeping")}
  save();stats()}
 if(!S.sleeping&&!tm&&!dn&&!bot.dataset.t&&["idle","tired"].includes(bot.dataset.s)){
  if(bot.dataset.s!==base())setState(base());
  if(idle>=nx){idle=0;nx=7+Math.floor(Math.random()*8);auto()}}
 },1000)}
$("lang").onchange=e=>{S.lang=e.target.value;save();render()};
setState(base());render();life();setTimeout(()=>react("greet","curious",2500),700);
</script></body></html>
