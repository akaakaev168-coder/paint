@media(max-width:800px){main{grid-template-columns:1fr}}
.stage{background:linear-gradient(#070d24,#050816);border:1px solid var(--ln);border-radius:18px;padding:12px;text-align:center}

.eye{fill:var(--a);transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}

#bot{--sp:1}

@keyframes float{50%{transform:translateY(-5px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{50%{transform:scaleY(2.4)}}@keyframes hop{50%{transform:translateY(-14px)}}
[data-s=listening] .wave{opacity:1}[data-s=listening] .wave rect{animation:talk .5s infinite;transform-box:fill-box;transform-origin:center}
[data-s=thinking] .gear,[data-s=working] .gear,[data-s=coding] .gear,[data-s=debugging] .gear{opacity:1;animation:spin 2s linear infinite;transform-box:fill-box;transform-origin:center}
[data-s=thinking] .eye{animation:pulse .8s infinite}
[data-s=speaking] .mouth{animation:talk .3s infinite;transform-box:fill-box;transform-origin:center}
[data-s=happy] .eye,[data-s=celebrating] .eye{filter:drop-shadow(0 0 14px #fff)}
[data-s=celebrating] .head{animation:hop .5s infinite}
[data-s=curious] .head{transform:rotate(-6deg);transform-origin:170px 150px;animation:none}
[data-s=coding] .eye{fill:var(--v)}[data-s=debugging] .eye{fill:#ffb020}
[data-s=tired] .eye{transform:scaleY(.45);animation:none}[data-s=tired] .head{animation-duration:9s}
[data-s=sleeping] .eye{transform:scaleY(.08);animation:none}[data-s=sleeping] .zz{opacity:1;animation:pulse 2s infinite}
[data-s=error] .eye{fill:#ff4d6d}[data-s=error] .warn{opacity:1;animation:pulse .6s infinite}

.row{display:flex;gap:6px}.row input{flex:1;min-width:0}
canvas{width:100%;max-width:320px;background:#050816;border:1px solid var(--ln);border-radius:12px;touch-action:none;display:block;margin:8px auto}
.empty{color:var(--mu);text-align:center;padding:16px}
textarea{width:100%;height:140px;font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const G={on:false,p:false,x:160,it:[],sc:0,li:3,t:0,sp:0,raf:0,end:"",keys:{}};
function gameUI(v){v.onclick=null;
 v.innerHTML=`<p>${t("gdesc")}</p><div class="row"><b id="gs"></b></div><canvas id="cv" width="320" height="420"></canvas><div class="row"><button id="gl">◀</button><button id="gst"></button><button id="gr">▶</button></div><p id="gm" class="empty">${G.end}</p>`;
 const cv=$("cv");cv.onpointermove=e=>{const r=cv.getBoundingClientRect();G.x=(e.clientX-r.left)*320/r.width};
 const hold=(id,d)=>{const b=$(id);b.onpointerdown=()=>G.keys[d]=1;b.onpointerup=b.onpointerleave=()=>G.keys[d]=0};hold("gl","l");hold("gr","r");
 $("gst").onclick=()=>{if(!G.on)gstart();else gpause()};gtxt();draw()}
function gtxt(){if(!$("gst"))return;$("gst").textContent=!G.on?(G.end?t("restart"):t("start")):G.p?t("resume"):t("pause");$("gs").textContent=`${t("score")}: ${G.sc} · ${t("lives")}: ${G.li} · ${t("best")}: ${S.best}`}
function gstart(){Object.assign(G,{on:true,p:false,it:[],sc:0,li:3,t:0,sp:0,end:""});$("gm").textContent="";loop();gtxt()}
function gpause(force){if(!G.on)return;if(force)G.p=true;else G.p=!G.p;if(!G.p)loop();else cancelAnimationFrame(G.raf);gtxt()}
function gend(win){G.on=false;cancelAnimationFrame(G.raf);const n=win?G.sc+10:Math.floor(G.sc/2);S.coins+=n;S.mood=cl(S.mood+(win?10:-2));if(G.sc>S.best)S.best=G.sc;
 G.end=t(win?"win":"lose").replace("{n}",n);save();setState(win?"celebrating":"idle",3000);stats();if($("gm")){$("gm").textContent=G.end;gtxt();draw()}}
function loop(){if(!G.on||G.p||tab!=="game")return;G.raf=requestAnimationFrame(loop);
 if(G.keys.l)G.x-=5;if(G.keys.r)G.x+=5;G.x=Math.max(30,Math.min(290,G.x));
 const spd=2+G.sc*.12,gap=Math.max(25,45-G.sc);if(++G.t%gap===0)G.it.push({x:20+Math.random()*280,y:-10,bad:Math.random()<.3});
 for(const o of G.it){o.y+=spd;if(o.y>380&&o.y<405&&Math.abs(o.x-G.x)<34){o.d=1;if(o.bad)G.li--;else G.sc++}else if(o.y>430)o.d=1}
 G.it=G.it.filter(o=>!o.d);gtxt();draw();if(G.li<=0)gend(false);else if(G.sc>=20)gend(true)}
function draw(){const c=$("cv");if(!c)return;const x=c.getContext("2d");x.clearRect(0,0,320,420);
 const a=getComputedStyle(document.documentElement).getPropertyValue("--a");
 for(const o of G.it){x.fillStyle=o.bad?"#ff4d6d":a;x.beginPath();x.arc(o.x,o.y,9,0,7);x.fill()}
 x.fillStyle="#8b9bd0";x.fillRect(G.x-32,392,64,10)}
document.addEventListener("keydown",e=>{if(tab!=="game")return;if(e.key==="ArrowLeft")G.keys.l=1;if(e.key==="ArrowRight")G.keys.r=1});
document.addEventListener("keyup",e=>{if(e.key==="ArrowLeft")G.keys.l=0;if(e.key==="ArrowRight")G.keys.r=0});
/* shop */
const SHOP=[{id:"cell",n:"cell",p:10,k:"inv"},{id:"coffee",n:"coffee",p:5,k:"inv"},{id:"food",n:"food",p:8,k:"inv"},{id:"violet",n:"theme",p:30,k:"theme"},{id:"acc",n:"acc",p:25,k:"acc"}];
function shopUI(v){v.innerHTML=`<p><b>${t("coins")}: ${S.coins}</b></p><div class="grid">`+SHOP.map(i=>{
 const own=i.k==="theme"?S.themes.includes("violet"):i.k==="acc"?S.acc:false;
 return `<div><div>${t(i.n)}${i.k==="inv"?" ("+S.inv[i.id]+")":""}</div><button data-b="${i.id}" ${own?"disabled":""}>${own?t("owned"):t("buy")+" · "+i.p}</button>${own&&i.k==="theme"?`<button data-u="${S.theme==="violet"?"cyan":"violet"}">${t("use")}</button>`:""}</div>`}).join("")+"</div>";
 v.onclick=e=>{const b=e.target.closest("[data-b]"),u=e.target.closest("[data-u]");
  if(u){S.theme=u.dataset.u;save();return render()}
  if(!b)return;const i=SHOP.find(x=>x.id===b.dataset.b);if(S.coins<i.p)return err(t("low"));
  S.coins-=i.p;if(i.k==="inv")S.inv[i.id]++;else if(i.k==="theme"){S.themes.push("violet");S.theme="violet"}else S.acc=true;
  save();toast(t("bought"));render()}}
/* data */
function dataUI(v){v.onclick=null;v.innerHTML=`<p class="empty">${t("dnote")}</p><div class="row"><button id="ex">${t("export")}</button><button id="cr">${t("clear")}</button></div><textarea id="tx" readonly hidden></textarea>`;
 $("ex").onclick=()=>{const x=$("tx");x.hidden=false;x.value=JSON.stringify(S,null,2);x.select()};
 $("cr").onclick=()=>{if(confirm(t("confirm"))){const l=S.lang;try{localStorage.removeItem(KEY)}catch(e){}S={...D,inv:{...D.inv},themes:["cyan"],chat:[],lang:l};toast(t("cleared"));render()}}}
/* life loop: exactly one timer */
function life(){if(tick)clearInterval(tick);tick=setInterval(()=>{
 if(S.sleeping){S.energy=cl(S.energy+CFG.sleepGain);if(S.energy>=100){S.sleeping=false;setState("happy",2000)}}
 else{S.energy=cl(S.energy-CFG.drain);S.battery=cl(S.battery-CFG.bat);S.focus=cl(S.focus-.2);if(S.energy<20)S.mood=cl(S.mood-.5)}
 if(S.battery<=0&&!S.sleeping){S.sleeping=true;setState("sleeping")}
 if(!tm&&!["listening","speaking","thinking"].includes($("bot").dataset.s))setState(base());
 save();stats()},CFG.tick)}
$("lang").onchange=e=>{S.lang=e.target.value;save();render()};
setState(base());render();life();
</script></body></html>
